[metadata]
name = sasci360apiscim
version = 0.0.1
author = Mark Nelson
author_email = support@nelsongrey.com
description = System for Cross-domain Identity Management REST API for SAS Customer Intelligence 360
long_description = file: README.md
long_description_content_type = text/markdown
url = https://gitlab.sas.com/psd-ci-enablement/sas_ci360_api_scim
project_urls = Bug Tracker = https://gitlab.sas.com/psd-ci-enablement/sas_ci360_api_scim/issues
classifiers = Programming Language :: Python :: 3
              License :: Other/Proprietary License
              Operating System :: OS Independent

[install_requires]
package = bottle==0.12.19
          chardet==4.0.0
          cryptography==36.0.2
          ipython-genutils==0.2.0
          lockfile==0.12.2
          matplotlib==3.5.1
          mistune==2.0.2
          numpy
          pexpect==4.8.0
          pickleshare==0.7.5
          pluggy==1.0.0
          pyasn1==0.4.8
          packaging
          pandas
          PyJWT
          python-daemon
          python-dateutil
          query-string
          requests==2.27.1
          rsa
          sas-dlpy==1.2.0
          sas-esppy
          SAS-kernel
          sasci360apicore
          saspy
          schedule
          urllib3==1.26.9
          webencodings==0.5.1
          ws4py==0.5.1

[options]
package_dir = = src
packages = find:
python_requires = >=3.6

[options.packages.find]
where = src
